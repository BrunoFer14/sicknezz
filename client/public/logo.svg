<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f3326"/>
      <stop offset="100%" stop-color="#0b120e"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d4ff8a"/>
      <stop offset="55%" stop-color="#8fe34a"/>
      <stop offset="100%" stop-color="#4f8a22"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)" transform="translate(256 262)">
    <!-- espigões do vírus -->
    <g stroke="#7fd13e" stroke-width="18" stroke-linecap="round" fill="#b6f36a">
      <g id="spike"><line x1="0" y1="-128" x2="0" y2="-176"/><circle cx="0" cy="-184" r="20" stroke="none"/></g>
      <use href="#spike" transform="rotate(40)"/>
      <use href="#spike" transform="rotate(80)"/>
      <use href="#spike" transform="rotate(120)"/>
      <use href="#spike" transform="rotate(160)"/>
      <use href="#spike" transform="rotate(200)"/>
      <use href="#spike" transform="rotate(240)"/>
      <use href="#spike" transform="rotate(280)"/>
      <use href="#spike" transform="rotate(320)"/>
    </g>
    <!-- corpo -->
    <circle r="138" fill="url(#body)"/>
    <circle cx="-62" cy="58" r="16" fill="#6fb832" opacity=".7"/>
    <circle cx="74" cy="-70" r="11" fill="#6fb832" opacity=".7"/>
    <circle cx="86" cy="64" r="8" fill="#6fb832" opacity=".7"/>
    <!-- cara doente: olhos em X e boca ondulada -->
    <g stroke="#0d1411" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M-66 -40 L-30 -4 M-30 -40 L-66 -4"/>
      <path d="M30 -40 L66 -4 M66 -40 L30 -4"/>
      <path d="M-52 52 q13 -16 26 0 t26 0 t26 0 t26 0"/>
    </g>
    <!-- gota de suor -->
    <path d="M104 -104 q14 22 0 34 q-14 -12 0 -34z" fill="#7fd6ff"/>
  </g>
</svg>
